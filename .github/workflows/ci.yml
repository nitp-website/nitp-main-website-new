name: CI - Build Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel previous runs if a new push is made to the same PR
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
